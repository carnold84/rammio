name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Versions are bumped locally. A changeset file still on main means
      # `pnpm run version` was skipped, so nothing would publish.
      - name: Check for unversioned changesets
        run: |
          if ls .changeset/*.md | grep -v '/README.md$'; then
            echo "::error::Unversioned changesets found. Run 'pnpm run version' and commit the result."
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      # No `registry-url`: the .npmrc it writes expects NODE_AUTH_TOKEN and
      # would take precedence over the OIDC exchange. No dependency cache
      # either: this job can publish, so it shouldn't restore shared state.
      # Node 26 bundles npm 11.20, above the 11.5.1 trusted publishing needs.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # Publishes any package whose version isn't on npm yet; no-op otherwise.
      - run: pnpm release
